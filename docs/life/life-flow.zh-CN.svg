<path d="M580 247H615" stroke="#3970ba" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M870 247H905" stroke="#3970ba" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
