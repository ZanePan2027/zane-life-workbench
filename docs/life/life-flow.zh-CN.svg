<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">真正的人生参谋，从你的生活出发</title><desc id="desc">想过的生活 → 当前阶段 → 人与局势 → 可能未来 → 路线与时间空间 → 做成眼前的事 → 根据反馈调整</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#3970ba" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="720" rx="24" fill="#f4f7fc"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Arial,sans-serif">
<text x="40" y="65" font-size="30" font-weight="700" fill="#172b4d">真正的人生参谋，从你的生活出发</text>
<text x="40" y="110" font-size="18" fill="#52647e">你讲情况、表达取舍、带回反馈；AI连起判断、路线和实际成果。</text>
<rect x="40" y="170" width="250" height="155" rx="18" fill="white" stroke="#d4dfef"/>
<text x="60" y="202" font-size="15" font-weight="700" fill="#3970ba">01</text>
<text x="60" y="248" font-size="22" font-weight="650" fill="#172b4d">想过的生活</text>
<text x="60" y="289" font-size="17" fill="#52647e">自己的目标与取舍</text>
<rect x="330" y="170" width="250" height="155" rx="18" fill="white" stroke="#d4dfef"/>
<text x="350" y="202" font-size="15" font-weight="700" fill="#3970ba">02</text>
<text x="350" y="248" font-size="22" font-weight="650" fill="#172b4d">当前阶段</text>
<text x="350" y="289" font-size="17" fill="#52647e">已经发生的进展与机会</text>
<rect x="620" y="170" width="250" height="155" rx="18" fill="white" stroke="#d4dfef"/>
<text x="640" y="202" font-size="15" font-weight="700" fill="#3970ba">03</text>
<text x="640" y="248" font-size="22" font-weight="650" fill="#172b4d">人与局势</text>
<text x="640" y="289" font-size="17" fill="#52647e">利益、行为、情绪与资源</text>
<rect x="910" y="170" width="250" height="155" rx="18" fill="white" stroke="#d4dfef"/>
<text x="930" y="202" font-size="15" font-weight="700" fill="#3970ba">04</text>
<text x="930" y="248" font-size="22" font-weight="650" fill="#172b4d">可能未来</text>
<text x="930" y="289" font-size="17" fill="#52647e">行动之后可能怎样变化</text>
<rect x="910" y="420" width="250" height="155" rx="18" fill="white" stroke="#d4dfef"/>
<text x="930" y="452" font-size="15" font-weight="700" fill="#3970ba">05</text>
<text x="930" y="498" font-size="22" font-weight="650" fill="#172b4d">路线与时间空间</text>
<text x="930" y="539" font-size="17" fill="#52647e">投入、顺序、窗口与备路</text>
<rect x="620" y="420" width="250" height="155" rx="18" fill="white" stroke="#d4dfef"/>
<text x="640" y="452" font-size="15" font-weight="700" fill="#3970ba">06</text>
<text x="640" y="498" font-size="22" font-weight="650" fill="#172b4d">做成眼前的事</text>
<text x="640" y="539" font-size="17" fill="#52647e">可用成果与授权行动</text>
<rect x="330" y="420" width="250" height="155" rx="18" fill="white" stroke="#d4dfef"/>
<text x="350" y="452" font-size="15" font-weight="700" fill="#3970ba">07</text>
<text x="350" y="498" font-size="22" font-weight="650" fill="#172b4d">根据反馈调整</text>
<text x="350" y="539" font-size="17" fill="#52647e">修正路线，继续了解你</text>
