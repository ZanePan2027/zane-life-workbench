<path d="M620 497H585" stroke="#3970ba" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M455 575V635H20V247H34" stroke="#3970ba" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="420" width="250" height="155" rx="18" fill="#e6eefb"/>
<text x="60" y="457" font-size="19" fill="#172b4d">知识让参谋更有见识</text>
<text x="60" y="497" font-size="16" fill="#172b4d">补遗漏办法，算实际付出</text>
<text x="60" y="537" font-size="16" fill="#172b4d">核对证据，把专业话说清</text>
<text x="40" y="685" font-size="17" fill="#52647e">经历越多，理解越深；每次帮助仍从你此刻想过的生活开始。</text>
