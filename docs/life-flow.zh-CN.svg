<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">懂你的方向，也帮你走好眼前这一步</title><desc id="desc">以终为始，看清局势，把计策变成生活中的进展</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3970ba" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="760" rx="24" fill="#f4f7fc"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Arial,sans-serif">
<text x="56" y="67" font-size="32" font-weight="700" fill="#172b4d">懂你的方向，也帮你走好眼前这一步</text>
<text x="56" y="109" font-size="18" fill="#52647e">以终为始，看清局势，把计策变成生活中的进展</text>
<rect x="56" y="168" width="328" height="180" rx="18" fill="white" stroke="#d4dfef"/>
<text x="80" y="205" font-size="15" font-weight="700" fill="#3970ba">01</text>
<text x="80" y="246" font-size="24" font-weight="650" fill="#172b4d">想过怎样的生活</text>
<text x="80" y="284" font-size="17" fill="#52647e">本人目标、取舍和在意的事</text>
<text x="80" y="312" font-size="17" fill="#52647e">判断眼前事情值不值得投入</text>
<rect x="436" y="168" width="328" height="180" rx="18" fill="white" stroke="#d4dfef"/>
<text x="460" y="205" font-size="15" font-weight="700" fill="#3970ba">02</text>
<text x="460" y="246" font-size="24" font-weight="650" fill="#172b4d">现在处于什么阶段</text>
<text x="460" y="284" font-size="17" fill="#52647e">找到关键障碍与正在出现的机会</text>
<text x="460" y="312" font-size="17" fill="#52647e">明确这一步在整个人生里的作用</text>
<rect x="816" y="168" width="328" height="180" rx="18" fill="white" stroke="#d4dfef"/>
<text x="840" y="205" font-size="15" font-weight="700" fill="#3970ba">03</text>
<text x="840" y="246" font-size="24" font-weight="650" fill="#172b4d">看清人和局势</text>
<text x="840" y="284" font-size="17" fill="#52647e">利益、情绪、行为、资源与环境</text>
<text x="840" y="312" font-size="17" fill="#52647e">推演不同选择可能引出的变化</text>
<rect x="56" y="422" width="328" height="180" rx="18" fill="white" stroke="#d4dfef"/>
<text x="80" y="459" font-size="15" font-weight="700" fill="#3970ba">06</text>
<text x="80" y="500" font-size="24" font-weight="650" fill="#172b4d">随经历修正认识</text>
<text x="80" y="538" font-size="17" fill="#52647e">带回实际发生的事和自己的感受</text>
<text x="80" y="566" font-size="17" fill="#52647e">更新对本人、他人和路线的理解</text>
<rect x="436" y="422" width="328" height="180" rx="18" fill="white" stroke="#d4dfef"/>
<text x="460" y="459" font-size="15" font-weight="700" fill="#3970ba">05</text>
<text x="460" y="500" font-size="24" font-weight="650" fill="#172b4d">把事情做出来</text>
<text x="460" y="538" font-size="17" fill="#52647e">完成草稿、比较、测算和安排</text>
<text x="460" y="566" font-size="17" fill="#52647e">推进实际行动，保存真实进展</text>
<rect x="816" y="422" width="328" height="180" rx="18" fill="white" stroke="#d4dfef"/>
<text x="840" y="459" font-size="15" font-weight="700" fill="#3970ba">04</text>
<text x="840" y="500" font-size="24" font-weight="650" fill="#172b4d">选路并安排时空</text>
<text x="840" y="538" font-size="17" fill="#52647e">主路、备路、时机和转向信号</text>
<text x="840" y="566" font-size="17" fill="#52647e">投入多久、在哪里做、等谁回应</text>
<path d="M388 258H426" fill="none" stroke="#3970ba" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M768 258H806" fill="none" stroke="#3970ba" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M980 352V411" fill="none" stroke="#3970ba" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M810 512H773" fill="none" stroke="#3970ba" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M430 512H393" fill="none" stroke="#3970ba" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M40 512H24V258H45" fill="none" stroke="#3970ba" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="56" y="682" font-size="18" fill="#334a68">你的目标决定方向；真实行动和反馈，让下一次判断更懂你。</text>
</g></svg>
